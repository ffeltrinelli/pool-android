
buildscript {
  repositories {
    mavenCentral()
    google()
  }
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Secrets remain local; CI deliberately keeps the standard debug certificate.
def signingOverride = System.getenv('POOL_SIGNING_PROPERTIES')
def signingFile = file(signingOverride ?: "${System.getProperty('user.home')}/.android/pool-signing/signing.properties")
def releaseCredentials = new Properties()
if (signingOverride != null && !signingFile.isFile()) {
  throw new GradleException('POOL_SIGNING_PROPERTIES does not point to a signing properties file')
}
if (signingFile.isFile()) {
  signingFile.withInputStream { releaseCredentials.load(it) }
  ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
    if (!releaseCredentials.getProperty(name)?.trim()) {
      throw new GradleException("Missing signing property: ${name}")
    }
  }
  if (!file(releaseCredentials.getProperty('storeFile')).isFile()) {
    throw new GradleException('Configured release keystore does not exist')
  }
}
def hasReleaseSigning = !releaseCredentials.isEmpty()


android {
  namespace = "io.github.ffeltrinelli.pool"
  compileSdk 36
  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.setSrcDirs(['src/main/java', 'src/main/kotlin'])
      aidl.setSrcDirs(['src/main/java', 'src/main/kotlin'])
      renderscript.setSrcDirs(['src/main/java', 'src/main/kotlin'])
      res.setSrcDirs(['res'])
      assets.setSrcDirs(['../assets'])
      jniLibs.setSrcDirs(['libs'])
    }
    androidTest {
      assets.srcDir '../core/src/test/resources'
    }
  }
  packagingOptions {
		resources {
			excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES',
                   'META-INF/dependencies.txt', '**/*.gwt.xml']
			pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/license.txt', 'META-INF/LGPL2.1',
                     'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/notice.txt']
		}
  }
  defaultConfig {
    applicationId 'io.github.ffeltrinelli.pool'
    minSdkVersion 26
    targetSdkVersion 34
    versionCode 2
    versionName "0.2.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  compileOptions {
    sourceCompatibility "17"
    targetCompatibility "17"
    coreLibraryDesugaringEnabled = true
  }
  signingConfigs {
    if (hasReleaseSigning) {
      stableRelease {
        storeFile file(releaseCredentials.getProperty('storeFile'))
        storePassword releaseCredentials.getProperty('storePassword')
        keyAlias releaseCredentials.getProperty('keyAlias')
        keyPassword releaseCredentials.getProperty('keyPassword')
      }
    }
  }
  buildTypes {
    debug {
      if (hasReleaseSigning) signingConfig signingConfigs.stableRelease
    }
    release {
      if (hasReleaseSigning) signingConfig signingConfigs.stableRelease
      minifyEnabled true
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), 'proguard-rules.pro'
    }
  }

  kotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)

}

repositories {
  // needed for AAPT2, may be needed for other tools
  google()
}

configurations { natives }

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  implementation project(':core')
  implementation "androidx.core:core:1.13.1"
  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "junit:junit:4.13.2"

  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"

  natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-x86_64"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

}

// Called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
tasks.register('copyAndroidNatives') {
  doFirst {
    file("libs/armeabi-v7a/").mkdirs()
    file("libs/arm64-v8a/").mkdirs()
    file("libs/x86_64/").mkdirs()
    file("libs/x86/").mkdirs()

    configurations.natives.copy().files.each { jar ->
      def outputDir = null
      if(jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
      if(jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
      if(jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
      if(jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
      if(outputDir != null) {
        copy {
          from zipTree(jar)
          into outputDir
          include "*.so"
        }
      }
    }
  }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
  packageTask.dependsOn 'copyAndroidNatives'
}

// Check only when producing a release: configuration and debug verification remain usable on CI.
def requireReleaseSigning = tasks.register('requireReleaseSigning') {
  doLast {
    if (!hasReleaseSigning) throw new GradleException('Release signing is required. See docs/releases.md.')
  }
}
tasks.configureEach {
  if (name == 'preReleaseBuild') dependsOn requireReleaseSigning
}
