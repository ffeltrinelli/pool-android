dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
    implementation 'org.apache.commons:commons-math3:3.6.1'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
}

tasks.register('difficultyCalibration', Test) {
    group = 'verification'
    description = 'Replay fixed plans across difficulty profiles and 64 execution seeds; writes CSV results.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching '*DifficultyCalibrationTest' }
    systemProperty 'pool.calibrateDifficulty', 'true'
    systemProperty 'pool.calibrationOutput', rootProject.file('build/reports/difficulty/calibration.csv').absolutePath
    outputs.upToDateWhen { false }
}

tasks.register('planningBenchmark', Test) {
    group = 'verification'
    description = 'Opt-in fixed-budget and five-second opponent measurements; writes CSV.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching '*PlanningBenchmarkTest'; includeTestsMatching '*PhysicsThroughputBenchmarkTest' }
    systemProperty 'pool.benchmark', 'true'
    systemProperty 'pool.benchmarkOutput', rootProject.file("build/reports/planning/${project.findProperty('planningReport') ?: 'benchmark'}.csv").absolutePath
    outputs.upToDateWhen { false }
}
